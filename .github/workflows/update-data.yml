name: Actualiser le Commodity Cockpit

on:
  push:
    paths:
      - 'scripts/update_data.py'
      - 'tests/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodity-cockpit-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les calculs
        run: python -m unittest discover -s tests -v
      - name: Collecter les publications officielles
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/update_data.py
      - name: Publier la nouvelle version ouvrable hors ligne
        run: |
          git add index.html README.md data/snapshot.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualiser les données officielles du cockpit'
            git push
          fi
